name: Security Service CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==============================
  # BUILD AND PUSH DOCKER IMAGE
  # ==============================
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Make Maven Wrapper executable
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # 4. Build Spring Boot JAR
      - name: Build Spring Boot application
        run: ./mvnw clean package -DskipTests

      # 5. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/security-service:latest \
            .

      # 7. Push Docker image to GHCR
      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/security-service:latest


  # ==============================
  # DEPLOY TO AWS EC2
  # ==============================
  deploy-to-ec2:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      # 8. Connect to EC2 and deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Login to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            # Pull latest image
            docker pull \
              ghcr.io/${{ github.repository_owner }}/security-service:latest

            # Stop old container
            docker stop security-service || true

            # Remove old container
            docker rm security-service || true

            # Start new container
            docker run -d \
              --name security-service \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/security-service.env \
              ghcr.io/${{ github.repository_owner }}/security-service:latest

            # Remove unused images
            docker image prune -f

            # Show running containers
            docker ps
