name: Security Service CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # 1. BUILD SPRING BOOT + DOCKER IMAGE + PUSH TO GHCR
  # ============================================================

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Java 21
      # --------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # --------------------------------------------------------
      # Build Spring Boot JAR
      # --------------------------------------------------------
      # Tests are skipped because the GitHub runner does not
      # contain your production MySQL database.
      # MySQL will be created later on EC2.
      # --------------------------------------------------------

      - name: Build Spring Boot application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests


      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: saigoverdhan
          password: ${{ secrets.GHCR_TOKEN }}


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      # IMPORTANT:
      # GHCR repository name MUST be lowercase.
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/saigoverdhan/security-service:latest .


      # --------------------------------------------------------
      # Push Docker image to GHCR
      # --------------------------------------------------------

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/saigoverdhan/security-service:latest


  # ============================================================
  # 2. DEPLOY TO AWS EC2
  # ============================================================

  deploy-to-ec2:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Connect to EC2
      # --------------------------------------------------------

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "=========================================="
            echo "STARTING SECURITY SERVICE DEPLOYMENT"
            echo "=========================================="


            # ==================================================
            # CREATE DEPLOYMENT DIRECTORY
            # ==================================================

            mkdir -p ~/security-service

            cd ~/security-service


            # ==================================================
            # LOGIN TO GHCR
            # ==================================================

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io \
              -u "saigoverdhan" \
              --password-stdin


            # ==================================================
            # CREATE EC2 .env FILE
            # ==================================================
            #
            # IMPORTANT:
            # These names MUST match your
            # application-env.properties.
            #
            # ==================================================

            cat > .env <<EOF

            # ==================================================
            # DATABASE
            # ==================================================

            DB_URL=jdbc:mysql://mysql:3306/security
            DB_USERNAME=securityuser
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}


            # ==================================================
            # GOOGLE OAUTH
            # ==================================================

            OAUTH_NAME=${{ secrets.GOOGLE_CLIENT_ID }}
            OAUTH_Secret=${{ secrets.GOOGLE_CLIENT_SECRET }}


            # ==================================================
            # SERVER
            # ==================================================

            server_port=8080


            # ==================================================
            # EUREKA
            # ==================================================

            eureka_server_url=http://localhost:8761/eureka/


            # ==================================================
            # JWT
            # ==================================================

            jwt_s_key=${{ secrets.JWT_SECRET }}

            access_token_expirey=${{ secrets.ACCESS_TOKEN_EXPIRY }}

            refresh_token_expirey=${{ secrets.REFRESH_TOKEN_EXPIRY }}


            # ==================================================
            # EMAIL / SMTP
            # ==================================================

            email_id=${{ secrets.MAIL_USERNAME }}

            email_password=${{ secrets.MAIL_PASSWORD }}

            EOF


            # Protect secrets

            chmod 600 .env


            # ==================================================
            # CREATE DOCKER COMPOSE FILE
            # ==================================================

            cat > docker-compose.yml <<'EOF'

            services:

              # ==================================================
              # MYSQL
              # ==================================================

              mysql:

                image: mysql:8.0

                container_name: security-mysql

                restart: unless-stopped

                environment:

                  MYSQL_DATABASE: security

                  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

                  MYSQL_USER: ${DB_USERNAME}

                  MYSQL_PASSWORD: ${DB_PASSWORD}

                volumes:

                  - mysql_data:/var/lib/mysql

                healthcheck:

                  test:
                    [
                      "CMD",
                      "mysqladmin",
                      "ping",
                      "-h",
                      "localhost",
                      "-u",
                      "root",
                      "-p${DB_ROOT_PASSWORD}"
                    ]

                  interval: 10s

                  timeout: 5s

                  retries: 10

                  start_period: 30s


              # ==================================================
              # SPRING BOOT APPLICATION
              # ==================================================

              security-service:

                image: ghcr.io/saigoverdhan/security-service:latest

                container_name: security-service

                restart: unless-stopped

                depends_on:

                  mysql:
                    condition: service_healthy

                ports:

                  - "8080:8080"

                environment:

                  # ------------------------------------------------
                  # DATABASE
                  # ------------------------------------------------

                  DB_URL: jdbc:mysql://mysql:3306/security

                  DB_USERNAME: ${DB_USERNAME}

                  DB_PASSWORD: ${DB_PASSWORD}


                  # ------------------------------------------------
                  # GOOGLE OAUTH
                  # ------------------------------------------------

                  OAUTH_NAME: ${OAUTH_NAME}

                  OAUTH_Secret: ${OAUTH_Secret}


                  # ------------------------------------------------
                  # SERVER
                  # ------------------------------------------------

                  server_port: ${server_port}


                  # ------------------------------------------------
                  # EUREKA
                  # ------------------------------------------------

                  eureka_server_url: ${eureka_server_url}

                  # If Eureka is not deployed on this EC2,
                  # disable Eureka client registration.
                  EUREKA_CLIENT_ENABLED: "false"


                  # ------------------------------------------------
                  # JWT
                  # ------------------------------------------------

                  jwt_s_key: ${jwt_s_key}

                  access_token_expirey: ${access_token_expirey}

                  refresh_token_expirey: ${refresh_token_expirey}


                  # ------------------------------------------------
                  # SMTP / GMAIL
                  # ------------------------------------------------

                  email_id: ${email_id}

                  email_password: ${email_password}


                  # ------------------------------------------------
                  # Spring Mail configuration
                  # ------------------------------------------------

                  SPRING_MAIL_HOST: smtp.gmail.com

                  SPRING_MAIL_PORT: 587

                  SPRING_MAIL_USERNAME: ${email_id}

                  SPRING_MAIL_PASSWORD: ${email_password}

                  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"

                  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"


            # ==================================================
            # MYSQL VOLUME
            # ==================================================

            volumes:

              mysql_data:

            EOF


            # ==================================================
            # SHOW CONFIGURATION
            # ==================================================

            echo "=========================================="
            echo "DOCKER COMPOSE CONFIGURATION"
            echo "=========================================="

            docker compose config


            # ==================================================
            # PULL LATEST APPLICATION IMAGE
            # ==================================================

            echo "=========================================="
            echo "PULLING LATEST SECURITY SERVICE IMAGE"
            echo "=========================================="

            docker pull \
              ghcr.io/saigoverdhan/security-service:latest


            # ==================================================
            # STOP OLD CONTAINERS
            # ==================================================

            echo "=========================================="
            echo "STOPPING OLD DEPLOYMENT"
            echo "=========================================="

            docker compose down


            # ==================================================
            # START MYSQL + SPRING BOOT
            # ==================================================

            echo "=========================================="
            echo "STARTING MYSQL + SPRING BOOT"
            echo "=========================================="

            docker compose up -d


            # ==================================================
            # WAIT FOR STARTUP
            # ==================================================

            echo "Waiting for containers to start..."

            sleep 20


            # ==================================================
            # CONTAINER STATUS
            # ==================================================

            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            docker ps


            # ==================================================
            # MYSQL STATUS
            # ==================================================

            echo "=========================================="
            echo "MYSQL STATUS"
            echo "=========================================="

            docker inspect \
              --format='{{.State.Health.Status}}' \
              security-mysql || true


            # ==================================================
            # MYSQL LOGS
            # ==================================================

            echo "=========================================="
            echo "MYSQL LOGS"
            echo "=========================================="

            docker logs --tail 30 security-mysql || true


            # ==================================================
            # SPRING BOOT LOGS
            # ==================================================

            echo "=========================================="
            echo "SPRING BOOT LOGS"
            echo "=========================================="

            docker logs --tail 80 security-service || true


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo "=========================================="
            echo "FINAL CONTAINER STATUS"
            echo "=========================================="

            docker ps


            echo "=========================================="
            echo "DEPLOYMENT COMPLETED"
            echo "=========================================="
