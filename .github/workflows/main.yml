name: Security Service CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # BUILD + PUSH DOCKER IMAGE
  # ============================================================

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build Spring Boot application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
         docker build \
           -t ghcr.io/saigoverdhan/security-service:latest .

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/saigoverdhan/security-service:latest


  # ============================================================
  # DEPLOY TO AWS EC2
  # ============================================================

  deploy-to-ec2:

    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "STARTING DEPLOYMENT"
            echo "======================================"

            # ==================================================
            # CREATE DEPLOYMENT DIRECTORY
            # ==================================================

            mkdir -p ~/security-service
            cd ~/security-service

            # ==================================================
            # LOGIN TO GHCR
            # ==================================================

            echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin

            # ==================================================
            # CREATE .env ON EC2
            # ==================================================

            cat > .env <<EOF

            DB_USERNAME=securityuser
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}

            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}

            GHCR_USERNAME=${{ github.repository_owner }}

            EOF

            chmod 600 .env

            # ==================================================
            # CREATE DOCKER COMPOSE FILE
            # ==================================================

            cat > docker-compose.yml <<'EOF'

            services:

              # ==================================================
              # MYSQL DATABASE
              # ==================================================

              mysql:

                image: mysql:8.0

                container_name: security-mysql

                restart: unless-stopped

                environment:
                  MYSQL_DATABASE: security
                  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
                  MYSQL_USER: ${DB_USERNAME}
                  MYSQL_PASSWORD: ${DB_PASSWORD}

                volumes:
                  - mysql_data:/var/lib/mysql

                healthcheck:

                  test:
                    [
                      "CMD",
                      "mysqladmin",
                      "ping",
                      "-h",
                      "localhost",
                      "-u",
                      "root",
                      "-p${DB_ROOT_PASSWORD}"
                    ]

                  interval: 10s
                  timeout: 5s
                  retries: 10
                  start_period: 30s


              # ==================================================
              # SPRING BOOT APPLICATION
              # ==================================================

              security-service:

                image: ghcr.io/saigoverdhan/security-service:latest

                container_name: security-service

                restart: unless-stopped

                depends_on:

                  mysql:
                    condition: service_healthy

                ports:
                  - "8080:8080"

                environment:

                  # DATABASE
                  DB_URL: jdbc:mysql://mysql:3306/security
                  DB_USERNAME: ${DB_USERNAME}
                  DB_PASSWORD: ${DB_PASSWORD}

                  # JWT
                  JWT_SECRET: ${JWT_SECRET}

                  # GOOGLE OAUTH
                  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

                  # SMTP / GMAIL
                  SPRING_MAIL_HOST: smtp.gmail.com
                  SPRING_MAIL_PORT: 587
                  SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
                  SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

                  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
                  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

            volumes:

              mysql_data:

            EOF

            # ==================================================
            # PULL LATEST APPLICATION IMAGE
            # ==================================================

            echo "======================================"
            echo "PULLING LATEST IMAGE"
            echo "======================================"

            docker pull \
              ghcr.io/${{ github.repository_owner }}/security-service:latest

            # ==================================================
            # STOP OLD DEPLOYMENT
            # ==================================================

            echo "======================================"
            echo "STOPPING OLD CONTAINERS"
            echo "======================================"

            docker compose down

            # ==================================================
            # START MYSQL + SPRING BOOT
            # ==================================================

            echo "======================================"
            echo "STARTING APPLICATION"
            echo "======================================"

            docker compose up -d

            # ==================================================
            # WAIT FOR APPLICATION
            # ==================================================

            echo "Waiting for containers..."

            sleep 20

            # ==================================================
            # SHOW CONTAINER STATUS
            # ==================================================

            echo "======================================"
            echo "CONTAINER STATUS"
            echo "======================================"

            docker ps

            # ==================================================
            # SHOW MYSQL LOGS
            # ==================================================

            echo "======================================"
            echo "MYSQL LOGS"
            echo "======================================"

            docker logs --tail 30 security-mysql

            # ==================================================
            # SHOW SPRING BOOT LOGS
            # ==================================================

            echo "======================================"
            echo "SPRING BOOT LOGS"
            echo "======================================"

            docker logs --tail 50 security-service

            # ==================================================
            # DEPLOYMENT COMPLETE
            # ==================================================

            echo "======================================"
            echo "DEPLOYMENT COMPLETED"
            echo "======================================"
