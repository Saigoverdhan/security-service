```yaml
name: Security Service CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: security-service
  IMAGE_TAG: latest

jobs:

  # ==========================================
  # 1. BUILD + PUSH DOCKER IMAGE TO GHCR
  # ==========================================
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Build Spring Boot JAR
      # Tests are skipped because CI does not have your MySQL container
      - name: Build Spring Boot application
        run: ./mvnw clean package -DskipTests

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      # Push Docker image to GHCR
      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


  # ==========================================
  # 2. DEPLOY TO AWS EC2
  # ==========================================
  deploy-to-ec2:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      # Deploy through SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

            # Pull latest image
            docker pull \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # Stop old container if it exists
            docker stop security-service || true

            # Remove old container if it exists
            docker rm security-service || true

            # Start new Spring Boot container
            docker run -d \
              --name security-service \
              --restart unless-stopped \
              -p 8080:8080 \
              ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # Show running containers
            docker ps

            # Show application logs
            docker logs --tail 50 security-service
```
