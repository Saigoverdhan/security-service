
name: Security Service CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # BUILD + DOCKER IMAGE + PUSH TO GHCR
  # ============================================================

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build Spring Boot application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/security-service:latest .

      # 6. Push Docker image to GHCR
      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/security-service:latest


  # ============================================================
  # DEPLOY TO AWS EC2
  # ============================================================

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # 1. Connect to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            echo "======================================"
            echo "Starting deployment..."
            echo "======================================"

            # ------------------------------------------
            # Login to GitHub Container Registry
            # ------------------------------------------

            echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin

            # ------------------------------------------
            # Create deployment directory
            # ------------------------------------------

            mkdir -p ~/security-service
            cd ~/security-service

            # ------------------------------------------
            # Create docker-compose.yml
            # ------------------------------------------

            cat > docker-compose.yml <<'EOF'

            services:

              mysql:
                image: mysql:8.0
                container_name: security-mysql
                restart: unless-stopped

                environment:
                  MYSQL_DATABASE: security
                  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
                  MYSQL_USER: ${DB_USERNAME}
                  MYSQL_PASSWORD: ${DB_PASSWORD}

                volumes:
                  - mysql_data:/var/lib/mysql

                healthcheck:
                  test:
                    [
                      "CMD",
                      "mysqladmin",
                      "ping",
                      "-h",
                      "localhost",
                      "-u",
                      "root",
                      "-p${DB_ROOT_PASSWORD}"
                    ]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                  start_period: 30s


              security-service:
                image: ghcr.io/${GHCR_USERNAME}/security-service:latest
                container_name: security-service
                restart: unless-stopped

                depends_on:
                  mysql:
                    condition: service_healthy

                ports:
                  - "8080:8080"

                environment:

                  DB_URL: jdbc:mysql://mysql:3306/security
                  DB_USERNAME: ${DB_USERNAME}
                  DB_PASSWORD: ${DB_PASSWORD}

                  JWT_SECRET: ${JWT_SECRET}

                  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

                  MAIL_USERNAME: ${MAIL_USERNAME}
                  MAIL_PASSWORD: ${MAIL_PASSWORD}

            volumes:
              mysql_data:

            EOF

            # ------------------------------------------
            # Create .env
            # ------------------------------------------

            cat > .env <<'EOF'

            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}

            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}

            GHCR_USERNAME=${{ github.repository_owner }}

            EOF

            # ------------------------------------------
            # Pull latest image
            # ------------------------------------------

            docker pull \
              ghcr.io/${{ github.repository_owner }}/security-service:latest

            # ------------------------------------------
            # Start application + MySQL
            # ------------------------------------------

            docker compose down

            docker compose up -d

            # ------------------------------------------
            # Show running containers
            # ------------------------------------------

            echo "======================================"
            echo "Running containers:"
            echo "======================================"

            docker ps

            # ------------------------------------------
            # Show application logs
            # ------------------------------------------

            echo "======================================"
            echo "Application logs:"
            echo "======================================"

            docker logs --tail 50 security-service

            echo "======================================"
            echo "Deployment completed!"
            echo "======================================"
